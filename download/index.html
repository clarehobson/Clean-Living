<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Clean Living</title>
<meta name="description" content="Clean Living: 12 Step Recovery. Download free on the App Store and Google Play.">
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#0D0D1A; color:#fff; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; text-align:center; }
  main { padding:32px 24px; max-width:420px; }
  h1 { font-size:24px; margin:0 0 10px; }
  p { color:#9a9aa8; line-height:1.5; margin:0 0 24px; }
  a.btn { display:block; margin:10px 0; padding:14px; border-radius:999px; background:#C9A84C; color:#1A1208;
          font-weight:600; text-decoration:none; }
</style>
<script>
  // Send each phone straight to its own store. Works from TikTok/Instagram in-app browsers too.
  (function () {
    var ua = navigator.userAgent || "";
    var src = (location.search.match(/[?&]src=([\w-]+)/) || [])[1] || "web";
    if (/android/i.test(ua)) {
      location.replace("https://play.google.com/store/apps/details?id=app.cleanliving&referrer=utm_source%3D" + src);
    } else if (/iphone|ipad|ipod/i.test(ua) || (/macintosh/i.test(ua) && "ontouchend" in document)) {
      location.replace("https://apps.apple.com/app/id6760635834");
    }
  })();
</script>
</head>
<body>
<main>
  <h1>Get Clean Living</h1>
  <p>12 Step Recovery &mdash; free to download.</p>
  <a class="btn" href="https://apps.apple.com/app/id6760635834">App Store (iPhone)</a>
  <a class="btn" href="https://play.google.com/store/apps/details?id=app.cleanliving">Google Play (Android)</a>
</main>
</body>
</html>
